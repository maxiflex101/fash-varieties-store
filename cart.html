<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - FASH VARIETIES STORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fashNavy: '#0b1d3a', fashNavyDark: '#071226',
                        fashGold: '#d4af37', fashLightBg: '#f8fafc'
                    },
                    fontFamily: { sans: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-fashLightBg text-gray-800 font-sans min-h-screen flex flex-col pb-16">
    <header class="bg-fashNavy text-white sticky top-0 z-40 shadow-lg border-b-2 border-fashGold">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="font-bold text-lg text-white">FASH VARIETIES STORE</a>
            <a href="shop.html" class="text-xs text-fashGold font-semibold hover:underline">Continue Shopping</a>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
        <h2 class="text-2xl font-bold text-fashNavy border-l-4 border-fashGold pl-3">Your Shopping Cart</h2>

        <div class="bg-white p-6 rounded-2xl shadow-lg border border-gray-200 space-y-6">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="border-b border-gray-200 text-xs uppercase text-gray-500 bg-fashLightBg">
                            <th class="p-3">Product</th>
                            <th class="p-3">Options</th>
                            <th class="p-3">Price</th>
                            <th class="p-3">Quantity</th>
                            <th class="p-3">Subtotal</th>
                            <th class="p-3 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="cartTableBody" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>

            <div id="emptyCartMessage" class="hidden text-center py-8 space-y-3">
                <i class="fa-solid fa-basket-shopping text-4xl text-gray-300"></i>
                <p class="text-gray-500 font-medium">Your shopping cart is currently empty.</p>
                <a href="shop.html" class="inline-block bg-fashNavy text-fashGold font-bold px-5 py-2 rounded-xl text-xs uppercase">Start Shopping</a>
            </div>

            <div id="cartSummaryContainer" class="flex flex-col md:flex-row justify-between items-center gap-4 pt-4 border-t border-gray-200">
                <a href="shop.html" class="w-full md:w-auto bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold px-6 py-2.5 rounded-xl text-sm transition text-center">
                    Continue Shopping
                </a>
                <div class="flex items-center gap-6 w-full md:w-auto justify-end">
                    <div class="text-right">
                        <span class="text-xs text-gray-500 uppercase font-semibold">Total Amount:</span>
                        <div id="cartTotal" class="text-2xl font-extrabold text-fashNavy">₦0</div>
                    </div>
                    <button onclick="proceedToCheckout()" class="bg-fashNavy hover:bg-fashGold hover:text-fashNavy text-fashGold font-bold px-8 py-3 rounded-xl shadow-md text-sm uppercase transition">
                        Proceed to Checkout
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-fashNavy text-white text-center py-4 text-xs mt-auto border-t-2 border-fashGold">
        2026 © FASH VARIETIES STORE. All rights reserved.
    </footer>

    <script>
        let cart = JSON.parse(localStorage.getItem('fv_cart')) || [];

        document.addEventListener("DOMContentLoaded", () => {
            renderCartTable();
        });

        function renderCartTable() {
            const tbody = document.getElementById('cartTableBody');
            const emptyMsg = document.getElementById('emptyCartMessage');
            const summaryContainer = document.getElementById('cartSummaryContainer');

            if (cart.length === 0) {
                tbody.innerHTML = '';
                emptyMsg.classList.remove('hidden');
                summaryContainer.classList.add('hidden');
                document.getElementById('cartTotal').innerText = '₦0';
                return;
            }

            emptyMsg.classList.add('hidden');
            summaryContainer.classList.remove('hidden');

            let total = 0;
            tbody.innerHTML = cart.map((item, index) => {
                const subtotal = item.unitPrice * item.qty;
                total += subtotal;
                return `
                    <tr class="border-b border-gray-100">
                        <td class="p-3 flex items-center gap-3">
                            <img src="${item.image}" alt="${item.name}" class="w-12 h-12 object-contain rounded border">
                            <div>
                                <h4 class="font-bold text-gray-800 text-xs">${item.name}</h4>
                            </div>
                        </td>
                        <td class="p-3 text-xs text-gray-600">
                            ${item.size ? 'Size: ' + item.size + '<br>' : ''}
                            ${item.color ? 'Colour: ' + item.color + '<br>' : ''}
                            ${item.buyingSelection ? 'Selection: ' + item.buyingSelection : ''}
                        </td>
                        <td class="p-3 font-semibold text-gray-700">₦${item.unitPrice.toLocaleString()}</td>
                        <td class="p-3 font-bold">${item.qty}</td>
                        <td class="p-3 font-bold text-fashNavy">₦${subtotal.toLocaleString()}</td>
                        <td class="p-3 text-center">
                            <button onclick="removeCartItem(${index})" class="text-red-500 bg-red-50 p-1.5 rounded-lg"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');

            document.getElementById('cartTotal').innerText = `₦${total.toLocaleString()}`;
        }

        function removeCartItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('fv_cart', JSON.stringify(cart));
            renderCartTable();
        }

        function proceedToCheckout() {
            window.location.href = "checkout.html";
        }
    </script>
</body>
</html>
